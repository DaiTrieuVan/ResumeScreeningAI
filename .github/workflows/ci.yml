name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify open-source release files and SPDX headers
        shell: pwsh
        run: ./scripts/check_open_source_compliance.ps1
      - name: Reject secrets, PII-risk artifacts, and unsafe evaluation data
        shell: pwsh
        run: ./scripts/check_release_safety.ps1

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run backend tests
        working-directory: backend
        env:
          DISABLE_EMBEDDING_MODEL: "true"
        run: python -m pytest -q
      - name: Run deterministic competition benchmark
        env:
          OFFLINE_MODE: "true"
          DISABLE_EMBEDDING_MODEL: "true"
        run: python scripts/run_ai_benchmark.py --release-version 1.1.0-competition --commit-sha ${{ github.sha }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run component tests
        working-directory: frontend
        run: npm test -- --run
      - name: Build production bundle
        working-directory: frontend
        run: npm run build
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run acceptance journeys
        working-directory: frontend
        run: npm run test:e2e

  clean-room:
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    needs: [compliance, backend, frontend]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify source archive in a new offline workspace
        shell: pwsh
        run: ./scripts/verify_clean_room.ps1 -SourceMode Archive
