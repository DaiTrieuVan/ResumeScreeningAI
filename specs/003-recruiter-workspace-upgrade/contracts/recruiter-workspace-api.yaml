openapi: 3.1.0
info:
  title: Recruiter Workspace API
  version: 0.1.0
  description: Proposed v2 contract; legacy endpoints remain compatible during rollout.
servers:
  - url: /api/recruiter
paths:
  /jobs/{jobId}/criteria-sets:
    get:
      operationId: listCriteriaSets
      parameters: [{ $ref: '#/components/parameters/JobId' }]
      responses:
        '200':
          description: Criteria versions
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CriteriaSet' } }
    post:
      operationId: createCriteriaDraft
      parameters: [{ $ref: '#/components/parameters/JobId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CriteriaSetInput' }
      responses:
        '201': { description: Draft created, content: { application/json: { schema: { $ref: '#/components/schemas/CriteriaSet' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /criteria-sets/{criteriaSetId}/publish:
    post:
      operationId: publishCriteriaSet
      parameters:
        - { $ref: '#/components/parameters/CriteriaSetId' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '200': { description: Published version, content: { application/json: { schema: { $ref: '#/components/schemas/CriteriaSet' } } } }
        '409': { $ref: '#/components/responses/ConflictError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /jobs/{jobId}/upload-batches:
    post:
      operationId: createUploadBatch
      parameters: [{ $ref: '#/components/parameters/JobId' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                criteria_set_id: { type: string, format: uuid }
                auto_evaluate: { type: boolean, default: true }
                files: { type: array, maxItems: 200, items: { type: string, format: binary } }
      responses:
        '202': { description: Batch persisted and queued, content: { application/json: { schema: { $ref: '#/components/schemas/UploadBatch' } } } }
        '413': { description: File count or size limit exceeded }
        '422': { $ref: '#/components/responses/ValidationError' }
  /upload-batches/{batchId}:
    get:
      operationId: getUploadBatch
      parameters: [{ $ref: '#/components/parameters/BatchId' }]
      responses:
        '200': { description: Persisted batch state, content: { application/json: { schema: { $ref: '#/components/schemas/UploadBatch' } } } }
  /upload-batches/{batchId}/events:
    get:
      operationId: streamUploadBatchEvents
      parameters:
        - { $ref: '#/components/parameters/BatchId' }
        - { name: after, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        '200': { description: SSE stream; GET batch remains authoritative, content: { text/event-stream: { schema: { type: string } } } }
  /upload-batches/{batchId}/retry:
    post:
      operationId: retryUploadItems
      parameters:
        - { $ref: '#/components/parameters/BatchId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope]
              properties:
                scope: { type: string, enum: [FAILED_ONLY, SELECTED] }
                item_ids: { type: array, items: { type: string, format: uuid } }
      responses:
        '202': { description: Retry accepted, content: { application/json: { schema: { $ref: '#/components/schemas/UploadBatch' } } } }
  /jobs/{jobId}/candidates:
    get:
      operationId: queryCandidates
      parameters:
        - { $ref: '#/components/parameters/JobId' }
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: stage, in: query, schema: { type: array, items: { $ref: '#/components/schemas/PipelineStage' } } }
        - { name: mandatory_gate, in: query, schema: { type: string, enum: [PASSED, FAILED, NEEDS_REVIEW] } }
        - { name: min_score, in: query, schema: { type: number, minimum: 0, maximum: 100 } }
        - { name: skills, in: query, schema: { type: array, items: { type: string } } }
        - { name: sort, in: query, schema: { type: string, enum: [score_desc, score_asc, received_desc, experience_desc, risk_desc] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 10, maximum: 100, default: 25 } }
      responses:
        '200': { description: Server-filtered candidate page, content: { application/json: { schema: { $ref: '#/components/schemas/CandidatePage' } } } }
  /applications/{applicationId}:
    get:
      operationId: getCandidateApplication
      parameters: [{ $ref: '#/components/parameters/ApplicationId' }]
      responses:
        '200': { description: Detail with official evaluation, content: { application/json: { schema: { $ref: '#/components/schemas/CandidateDetail' } } } }
  /applications/{applicationId}/resume:
    get:
      operationId: viewOriginalResume
      parameters: [{ $ref: '#/components/parameters/ApplicationId' }]
      responses:
        '200': { description: Authorized inline PDF; access is audited, content: { application/pdf: { schema: { type: string, format: binary } } } }
        '403': { description: Actor cannot view candidate PII }
  /applications/{applicationId}/decisions:
    post:
      operationId: appendDecisionEvent
      parameters:
        - { $ref: '#/components/parameters/ApplicationId' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionInput' }
      responses:
        '201': { description: Event appended and projection updated, content: { application/json: { schema: { $ref: '#/components/schemas/DecisionEvent' } } } }
        '409': { $ref: '#/components/responses/ConflictError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /jobs/{jobId}/bulk-actions:
    post:
      operationId: executeBulkAction
      parameters:
        - { $ref: '#/components/parameters/JobId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkActionInput' }
      responses:
        '202': { description: Per-item outcomes are independent, content: { application/json: { schema: { $ref: '#/components/schemas/BulkActionResult' } } } }
  /jobs/{jobId}/comparisons:
    post:
      operationId: compareCandidates
      parameters: [{ $ref: '#/components/parameters/JobId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [application_ids, criteria_set_id]
              properties:
                application_ids: { type: array, minItems: 2, maxItems: 5, uniqueItems: true, items: { type: string, format: uuid } }
                criteria_set_id: { type: string, format: uuid }
      responses:
        '200': { description: Comparison on one criteria version, content: { application/json: { schema: { $ref: '#/components/schemas/Comparison' } } } }
        '409': { description: Candidate lacks evaluation for requested version }
  /jobs/{jobId}/analytics:
    get:
      operationId: getRecruiterAnalytics
      parameters: [{ $ref: '#/components/parameters/JobId' }]
      responses:
        '200': { description: Funnel and process metrics, content: { application/json: { schema: { $ref: '#/components/schemas/Analytics' } } } }
components:
  parameters:
    JobId: { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
    CriteriaSetId: { name: criteriaSetId, in: path, required: true, schema: { type: string, format: uuid } }
    BatchId: { name: batchId, in: path, required: true, schema: { type: string, format: uuid } }
    ApplicationId: { name: applicationId, in: path, required: true, schema: { type: string, format: uuid } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string }, description: Resource ETag/version }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128 } }
  responses:
    ValidationError: { description: Business or input validation failed, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    ConflictError: { description: Resource changed or versions mismatch, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  schemas:
    PipelineStage:
      type: string
      enum: [RECEIVED, AI_ANALYZED, RECRUITER_REVIEW, SHORTLISTED, HR_INTERVIEW, TECH_INTERVIEW, OFFER, HIRED, REJECTED]
    Criterion:
      type: object
      required: [id, category, importance, label, operator, expected_value, weight]
      properties:
        id: { type: string, format: uuid }
        category: { type: string, enum: [SKILL, EXPERIENCE, EDUCATION, LANGUAGE, LOCATION, OTHER] }
        importance: { type: string, enum: [MANDATORY, PREFERRED, BONUS] }
        label: { type: string }
        operator: { type: string, enum: [CONTAINS_ANY, CONTAINS_ALL, MIN_VALUE, EQUALS, CUSTOM_AI] }
        expected_value: {}
        weight: { type: number, minimum: 0, maximum: 1 }
    CriteriaSetInput:
      type: object
      required: [name, scoring_weights, criteria]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        scoring_weights: { type: object, additionalProperties: { type: number, minimum: 0, maximum: 1 } }
        criteria: { type: array, minItems: 1, items: { $ref: '#/components/schemas/Criterion' } }
    CriteriaSet:
      allOf:
        - { $ref: '#/components/schemas/CriteriaSetInput' }
        - type: object
          required: [id, job_id, version_number, status, created_at]
          properties:
            id: { type: string, format: uuid }
            job_id: { type: string, format: uuid }
            version_number: { type: integer, minimum: 1 }
            status: { type: string, enum: [DRAFT, PUBLISHED, RETIRED] }
            created_at: { type: string, format: date-time }
            published_at: { type: [string, 'null'], format: date-time }
    UploadItem:
      type: object
      required: [id, original_file_name, status, attempt_count]
      properties:
        id: { type: string, format: uuid }
        original_file_name: { type: string }
        status: { type: string, enum: [QUEUED, VALIDATING, PARSING, NEEDS_OCR, DEDUPE_REVIEW, READY, EVALUATING, COMPLETED, FAILED, CANCELLED] }
        attempt_count: { type: integer, minimum: 0 }
        error_code: { type: [string, 'null'] }
        user_message: { type: [string, 'null'] }
        duplicate_matches: { type: array, items: { type: object } }
    UploadBatch:
      type: object
      required: [id, job_id, status, counts, items, created_at]
      properties:
        id: { type: string, format: uuid }
        job_id: { type: string, format: uuid }
        criteria_set_id: { type: [string, 'null'], format: uuid }
        status: { type: string, enum: [CREATED, UPLOADING, PROCESSING, COMPLETED, COMPLETED_WITH_ERRORS, CANCELLED] }
        counts: { type: object, additionalProperties: { type: integer, minimum: 0 } }
        items: { type: array, items: { $ref: '#/components/schemas/UploadItem' } }
        created_at: { type: string, format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
    CandidateSummary:
      type: object
      required: [application_id, display_name, pipeline_stage, version]
      properties:
        application_id: { type: string, format: uuid }
        display_name: { type: string }
        current_title: { type: [string, 'null'] }
        latest_company: { type: [string, 'null'] }
        relevant_experience_months: { type: [integer, 'null'] }
        overall_score: { type: [number, 'null'], minimum: 0, maximum: 100 }
        mandatory_gate: { type: [string, 'null'], enum: [PASSED, FAILED, NEEDS_REVIEW, null] }
        pipeline_stage: { $ref: '#/components/schemas/PipelineStage' }
        evaluation_stale: { type: boolean }
        version: { type: integer }
    CandidatePage:
      type: object
      required: [items, page, page_size, total, facets]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CandidateSummary' } }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
        facets: { type: object }
    CriterionResult:
      type: object
      required: [criterion_id, result, confidence, evidence]
      properties:
        criterion_id: { type: string, format: uuid }
        result: { type: string, enum: [MET, NOT_MET, UNKNOWN, NOT_APPLICABLE] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        explanation: { type: string }
        evidence:
          type: array
          items:
            type: object
            required: [excerpt, polarity, confidence]
            properties:
              page_number: { type: [integer, 'null'], minimum: 1 }
              excerpt: { type: string, maxLength: 1000 }
              polarity: { type: string, enum: [SUPPORTS, CONTRADICTS, CONTEXT] }
              confidence: { type: number, minimum: 0, maximum: 1 }
    CandidateDetail:
      allOf:
        - { $ref: '#/components/schemas/CandidateSummary' }
        - type: object
          properties:
            contact: { type: object }
            extracted_fields: { type: object }
            criterion_results: { type: array, items: { $ref: '#/components/schemas/CriterionResult' } }
            timeline: { type: array, items: { $ref: '#/components/schemas/DecisionEvent' } }
    DecisionInput:
      type: object
      required: [event_type]
      properties:
        event_type: { type: string, enum: [STAGE_CHANGED, NOTE_ADDED, HUMAN_DECISION, SCORE_OVERRIDE] }
        to_stage: { $ref: '#/components/schemas/PipelineStage' }
        decision: { type: string, enum: [ADVANCE, HOLD, REJECT, HIRE] }
        reason_code: { type: string }
        note: { type: string, maxLength: 5000 }
    DecisionEvent:
      allOf:
        - { $ref: '#/components/schemas/DecisionInput' }
        - type: object
          required: [id, actor_id, created_at]
          properties:
            id: { type: string, format: uuid }
            actor_id: { type: string }
            from_stage: { oneOf: [{ $ref: '#/components/schemas/PipelineStage' }, { type: 'null' }] }
            created_at: { type: string, format: date-time }
    BulkActionInput:
      type: object
      required: [selection, action]
      properties:
        selection:
          type: object
          description: Explicit IDs or a server-side query snapshot plus exclusions
          properties:
            application_ids: { type: array, items: { type: string, format: uuid } }
            query_snapshot: { type: object }
            excluded_ids: { type: array, items: { type: string, format: uuid } }
        action:
          type: object
          required: [type]
          properties:
            type: { type: string, enum: [CHANGE_STAGE, ADD_TAG, EXPORT, REANALYZE] }
            payload: { type: object }
    BulkActionResult:
      type: object
      required: [id, status, summary, items]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [QUEUED, RUNNING, COMPLETED, COMPLETED_WITH_ERRORS] }
        summary: { type: object }
        items:
          type: array
          items:
            type: object
            required: [application_id, status]
            properties:
              application_id: { type: string, format: uuid }
              status: { type: string, enum: [PENDING, SUCCEEDED, FAILED, CONFLICT] }
              error: { type: [string, 'null'] }
    Comparison:
      type: object
      required: [criteria_set_id, candidates, criteria]
      properties:
        criteria_set_id: { type: string, format: uuid }
        candidates: { type: array, items: { $ref: '#/components/schemas/CandidateSummary' } }
        criteria: { type: array, items: { type: object } }
    Analytics:
      type: object
      properties:
        funnel: { type: object, additionalProperties: { type: integer } }
        upload_counts: { type: object, additionalProperties: { type: integer } }
        median_processing_seconds: { type: number }
        ai_override_rate: { type: number, minimum: 0, maximum: 1 }
    Problem:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        field_errors: { type: object }
        request_id: { type: string }
